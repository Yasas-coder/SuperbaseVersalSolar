<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Data Analyzer</title>
    
    <!-- Load ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #00e676;
            --soc-color: #4cd137;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="datetime-local"] {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            color-scheme: dark;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #00c853; }
        .badges {
            display: flex;
            gap: 10px;
        }
        .badge {
            background: #333;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: bold;
            border-left: 4px solid var(--soc-color);
        }
        .chart-container {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #loading { display: none; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin: 0 0 10px 0;">⚡ Interactive Solar Analyzer</h2>
            <div class="badges">
                <div class="badge">Battery: 52Ah LiFePO4</div>
                <div class="badge" style="border-left-color: #f1c40f;">Estimated SOH: 100% (Calibrating...)</div>
            </div>
        </div>
        <div class="control-group">
            <label>Start:</label>
            <input type="datetime-local" id="start-date">
            <label>End:</label>
            <input type="datetime-local" id="end-date">
            <button onclick="fetchAndRenderData()">Analyze Data</button>
            <span id="loading">Loading data...</span>
        </div>
    </div>

    <!-- Chart Divs -->
    <div class="chart-container"><div id="socChart"></div></div>
    <div class="chart-container"><div id="voltageChart"></div></div>
    <div class="chart-container"><div id="currentChart"></div></div> <!-- NEW CURRENT CHART -->
    <div class="chart-container"><div id="loadChart"></div></div>

    <script>
        // --- 1. SETUP SUPABASE CREDENTIALS ---
        const SUPABASE_URL = "https://znwuyunwtwurrejowkaz.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpud3V5dW53dHd1cnJlam93a2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzI1MzYsImV4cCI6MjEwMTM0ODUzNn0.K5M2TbML6mWuE6O5uLkIsMIaaun1hmAl8EJeVlsoKrI"; 
        
        let socChartInstance = null;
        let voltChartInstance = null;
        let currentChartInstance = null; // New instance
        let loadChartInstance = null;

        window.onload = () => {
            const now = new Date();
            const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
            document.getElementById('start-date').value = yesterday.toISOString().slice(0,16);
            document.getElementById('end-date').value = now.toISOString().slice(0,16);
            fetchAndRenderData();
        };

        async function fetchAndRenderData() {
            const loadingText = document.getElementById('loading');
            loadingText.style.display = 'inline';
            loadingText.innerText = 'Initializing...';
            
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const startISO = new Date(startDate).toISOString();
            const endISO = new Date(endDate).toISOString();

            let allData = [];
            let offset = 0;
            const limit = 1000;
            let keepFetching = true;

            try {
                while (keepFetching) {
                    loadingText.innerText = `Downloading... (${allData.length} rows)`;
                    // Added battery_a to the select query
                    const url = `${SUPABASE_URL}/rest/v1/solar_telemetry?created_at=gte.${startISO}&created_at=lte.${endISO}&select=created_at,battery_v,battery_a,load_w,soc&order=created_at.asc&limit=${limit}&offset=${offset}`;

                    const response = await fetch(url, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                    
                    const chunk = await response.json();
                    allData = allData.concat(chunk);

                    if (chunk.length === limit) {
                        offset += limit; 
                    } else {
                        keepFetching = false; 
                    }
                }

                loadingText.innerText = 'Drawing charts...';

                const maxPoints = 3000; 
                const step = Math.max(1, Math.ceil(allData.length / maxPoints)); 
                
                const socData = [];
                const voltageData = [];
                const currentData = []; // New array for Amps
                const loadData = [];

                for (let i = 0; i < allData.length; i += step) {
                    let row = allData[i];
                    
                    let timeString = row.created_at;
                    if (!timeString.endsWith('Z') && !timeString.includes('+')) timeString += 'Z'; 
                    const timestamp = new Date(timeString).getTime();

                    if (row.soc !== null && row.soc !== undefined) socData.push([timestamp, row.soc]);
                    if (row.battery_v !== null) voltageData.push([timestamp, row.battery_v]);
                    if (row.battery_a !== null) currentData.push([timestamp, row.battery_a]); // Push Amps
                    if (row.load_w !== null) loadData.push([timestamp, row.load_w]);
                }

                // Pass the new current array to the renderer
                renderCharts(socData, voltageData, currentData, loadData);
                
            } catch (error) {
                console.error("Error fetching data:", error);
                alert("Failed to fetch data from Supabase. Check console.");
            } finally {
                loadingText.style.display = 'none';
            }
        }

        function renderCharts(socData, voltageData, currentData, loadData) {
            const commonOptions = {
                chart: {
                    type: 'area', height: 250, background: '#1e1e1e',
                    animations: { enabled: false },
                    toolbar: { autoSelected: 'zoom' },
                    group: 'solar-sync', // This links all 4 charts together!
                    id: 'base-chart'
                },
                theme: { mode: 'dark' },
                dataLabels: { enabled: false },
                stroke: { curve: 'smooth', width: 2 },
                xaxis: { type: 'datetime', labels: { datetimeUTC: false } },
                tooltip: { x: { format: 'dd MMM yyyy HH:mm:ss' } }
            };

            // --- SOC CHART ---
            const socOptions = {
                ...commonOptions,
                chart: { ...commonOptions.chart, id: 'soc-chart' },
                series: [{ name: 'State of Charge (%)', data: socData }],
                colors: ['#4cd137'],
                title: { text: 'Battery SOC (%)', align: 'left', style: { color: '#fff' } },
                yaxis: { title: { text: '%' }, min: 0, max: 100, decimalsInFloat: 1 }
            };

            // --- VOLTAGE CHART ---
            const voltOptions = {
                ...commonOptions,
                chart: { ...commonOptions.chart, id: 'volt-chart' },
                series: [{ name: 'Battery Voltage (V)', data: voltageData }],
                colors: ['#00e676'],
                title: { text: 'Battery Voltage', align: 'left', style: { color: '#fff' } },
                yaxis: { title: { text: 'Volts' }, decimalsInFloat: 2, forceNiceScale: true }
            };

            // --- CURRENT CHART (NEW) ---
            const currentOptions = {
                ...commonOptions,
                chart: { ...commonOptions.chart, id: 'current-chart' },
                series: [{ name: 'Battery Current (A)', data: currentData }],
                colors: ['#ff9f43'], // Orange to match your ESP32 UI
                title: { text: 'Battery Current (Amps)', align: 'left', style: { color: '#fff' } },
                yaxis: { title: { text: 'Amps' }, decimalsInFloat: 2, forceNiceScale: true }
            };

            // --- LOAD CHART ---
            const loadOptions = {
                ...commonOptions,
                chart: { ...commonOptions.chart, id: 'load-chart' },
                series: [{ name: 'AC Load (W)', data: loadData }],
                colors: ['#ff3d00'],
                title: { text: 'AC Power Load', align: 'left', style: { color: '#fff' } },
                yaxis: { title: { text: 'Watts' }, decimalsInFloat: 0 }
            };

            // Destroy old instances to prevent ghosting
            if (socChartInstance) socChartInstance.destroy();
            if (voltChartInstance) voltChartInstance.destroy();
            if (currentChartInstance) currentChartInstance.destroy();
            if (loadChartInstance) loadChartInstance.destroy();

            // Create new charts
            socChartInstance = new ApexCharts(document.querySelector("#socChart"), socOptions);
            voltChartInstance = new ApexCharts(document.querySelector("#voltageChart"), voltOptions);
            currentChartInstance = new ApexCharts(document.querySelector("#currentChart"), currentOptions);
            loadChartInstance = new ApexCharts(document.querySelector("#loadChart"), loadOptions);

            // Render charts
            socChartInstance.render();
            voltChartInstance.render();
            currentChartInstance.render();
            loadChartInstance.render();
        }
    </script>
</body>
</html>
