<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Energy Forecaster</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00adb5;
      --warning-color: #ff9f43;
      --alert-color: #ff2e63;
      --text-color: #e0e0e0;
      --subtext-color: #aaa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1, h2, h3 { color: var(--accent-color); margin-bottom: 10px; }
    .card { background-color: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
    .metric-box { background-color: #252525; padding: 15px; border-radius: 6px; border-left: 4px solid var(--accent-color); }
    .metric-box.highlight { border-left-color: var(--warning-color); }
    .metric-box .label { font-size: 0.85em; color: var(--subtext-color); text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-box .value { font-size: 1.8em; font-weight: bold; margin-top: 5px; }
    .unit { font-size: 0.5em; color: var(--subtext-color); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--subtext-color); }
    input { background-color: #121212; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; width: 100%; max-width: 200px; box-sizing: border-box; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    button { background-color: var(--accent-color); color: #fff; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #008c93; }
    .progress-bar-bg { background-color: #333; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { background-color: var(--accent-color); height: 100%; width: 0%; transition: width 0.4s ease; }
    .status-text { font-size: 0.85em; color: var(--subtext-color); margin-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚡ Solar Energy & Billing Forecaster</h1>
    
    <!-- MAIN FORECAST CARD -->
    <div class="card">
      <h2>📅 Billing Cycle Forecast</h2>
      <p id="cycle-dates" style="color: var(--subtext-color); margin-top: -5px;">Calculating cycle dates...</p>

      <div class="grid-3">
        <div class="metric-box">
          <div class="label">Used So Far</div>
          <div class="value" id="val-used">-- <span class="unit">kWh</span></div>
        </div>

        <div class="metric-box">
          <div class="label">Daily Avg Rate</div>
          <div class="value" id="val-daily">-- <span class="unit">kWh/day</span></div>
        </div>

        <div class="metric-box highlight">
          <div class="label">Projected Month End</div>
          <div class="value" id="val-forecast" style="color: var(--warning-color);">-- <span class="unit">kWh</span></div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; font-size: 0.85em; color: var(--subtext-color);">
          <span>Cycle Progress</span>
          <span id="cycle-progress-text">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="cycle-progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- SETTINGS CONFIGURATION CARD -->
    <div class="card">
      <h3>⚙️ Cycle Parameters & Offsets</h3>
      <form id="settings-form">
        <div class="grid-3">
          <div class="form-group">
            <label for="last_billing_date">Last Billing Date</label>
            <input type="date" id="last_billing_date" required>
          </div>

          <div class="form-group">
            <label for="cycle_days">Cycle Duration (Days)</label>
            <input type="number" id="cycle_days" min="1" max="60" required>
          </div>

          <div class="form-group">
            <label for="energy_offset">Energy Offset (+ / - kWh)</label>
            <input type="number" id="energy_offset" step="0.001" required>
          </div>
        </div>

        <button type="submit">Save Configurations</button>
        <span id="save-status" style="margin-left: 10px; font-size: 0.9em;"></span>
      </form>
    </div>

    <div class="status-text" id="last-updated">Connecting to Supabase...</div>
  </div>

  <script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ⚡ SUPABASE INITIALIZATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const SUPABASE_URL = "https://znwuyunwtwurrejowkaz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pnvIkUa0rVkghi40HAqlYQ_DNFlitDR";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Initialize with safe defaults (today's date)
    let currentSettings = { 
      last_billing_date: new Date().toISOString().split('T')[0], 
      cycle_days: 30, 
      energy_offset: 0.0 
    };

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 📅 DYNAMIC DATE MATH
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function getBillingWindow(dateString, durationDays) {
      const now = new Date();
      
      // Parse YYYY-MM-DD cleanly to avoid timezone shifts
      const [y, m, d] = dateString.split('-');
      const cycleStart = new Date(y, m - 1, d, 0, 0, 0);

      // Add durationDays directly in milliseconds
      const cycleEnd = new Date(cycleStart.getTime() + (durationDays * 24 * 60 * 60 * 1000));

      return { cycleStart, cycleEnd, now };
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 📊 DATA FETCH & FORECAST CALCULATION
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function fetchForecastData() {
      try {
        // 1. Fetch settings from app_settings table
        const { data: settingsData, error: settingsError } = await _supabase
          .from('app_settings')
          .select('*')
          .eq('id', 1)
          .single();

        if (!settingsError && settingsData) {
          if (settingsData.last_billing_date) currentSettings.last_billing_date = settingsData.last_billing_date;
          if (settingsData.cycle_days) currentSettings.cycle_days = settingsData.cycle_days;
          currentSettings.energy_offset = settingsData.energy_offset || 0.0;
          
          document.getElementById('last_billing_date').value = currentSettings.last_billing_date;
          document.getElementById('cycle_days').value = currentSettings.cycle_days;
          document.getElementById('energy_offset').value = currentSettings.energy_offset;
        }

        // 2. Compute Billing Window
        const { cycleStart, cycleEnd, now } = getBillingWindow(currentSettings.last_billing_date, currentSettings.cycle_days);
        
        document.getElementById('cycle-dates').innerText = 
          `Current Cycle: ${cycleStart.toLocaleDateString()} to ${cycleEnd.toLocaleDateString()} (${currentSettings.cycle_days} Days)`;

        // 3. Fetch latest reading from solar_telemetry
        const { data: latestData, error: latestError } = await _supabase
          .from('solar_telemetry')
          .select('ac_energy, created_at')
          .not('ac_energy', 'is', null)
          .order('created_at', { ascending: false })
          .limit(1)
          .single();

        // 4. Fetch baseline reading at exact start of cycle
        const { data: startData, error: startError } = await _supabase
          .from('solar_telemetry')
          .select('ac_energy, created_at')
          .gte('created_at', cycleStart.toISOString())
          .not('ac_energy', 'is', null)
          .order('created_at', { ascending: true })
          .limit(1)
          .single();

        if (latestData) {
          const currentReading = latestData.ac_energy || 0;
          const startReading = startData ? (startData.ac_energy || currentReading) : currentReading;

          // Calculate energy used so far + custom offset
          const rawUsed = Math.max(0, currentReading - startReading);
          const totalUsed = rawUsed + parseFloat(currentSettings.energy_offset);

          // Calculate cycle durations for projection
          const totalCycleMs = cycleEnd - cycleStart;
          const elapsedMs = Math.max(1000 * 60 * 60, now - cycleStart); // Min 1 hour to avoid division by 0
          
          const elapsedDays = elapsedMs / (1000 * 60 * 60 * 24);
          const totalCycleDays = currentSettings.cycle_days;

          // Project forward linearly
          const dailyAvg = totalUsed / elapsedDays;
          const forecastedTotal = dailyAvg * totalCycleDays;

          // Update UI DOM Elements
          document.getElementById('val-used').innerHTML = `${totalUsed.toFixed(2)} <span class="unit">kWh</span>`;
          document.getElementById('val-daily').innerHTML = `${dailyAvg.toFixed(2)} <span class="unit">kWh/day</span>`;
          document.getElementById('val-forecast').innerHTML = `${forecastedTotal.toFixed(2)} <span class="unit">kWh</span>`;

          // Progress bar constraints (cap at 100%)
          const progressPct = Math.min(100, Math.max(0, (elapsedMs / totalCycleMs) * 100));
          document.getElementById('cycle-progress-bar').style.width = `${progressPct.toFixed(1)}%`;
          document.getElementById('cycle-progress-text').innerText = `${progressPct.toFixed(1)}%`;

          document.getElementById('last-updated').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
        }
      } catch (err) {
        console.error("Forecast Calculation Error:", err);
        document.getElementById('last-updated').innerText = "Failed to update forecast. Check database connection.";
      }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ⚙️ SETTINGS FORM HANDLER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('save-status');
      statusEl.innerText = "Saving...";
      statusEl.style.color = "var(--warning-color)";

      const newDate = document.getElementById('last_billing_date').value;
      const newCycle = parseInt(document.getElementById('cycle_days').value);
      const newOffset = parseFloat(document.getElementById('energy_offset').value);

      const { error } = await _supabase
        .from('app_settings')
        .upsert({ 
          id: 1, 
          last_billing_date: newDate, 
          cycle_days: newCycle, 
          energy_offset: newOffset 
        });

      if (error) {
        statusEl.innerText = "Error saving settings!";
        statusEl.style.color = "var(--alert-color)";
      } else {
        statusEl.innerText = "Settings Saved!";
        statusEl.style.color = "var(--accent-color)";
        setTimeout(() => statusEl.innerText = "", 3000);
        fetchForecastData(); // Recalculate immediately with new parameters
      }
    });

    // Auto-refresh loop
    fetchForecastData();
    setInterval(fetchForecastData, 30000);
  </script>
</body>
</html>
