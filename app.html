<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Native App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Smart Control</title>
    
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --sub-card: #282828;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-on: #00e676;
            --accent-off: #ff2e63;
            --accent-auto: #00adb5;
            --accent-timer: #9c27b0;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 40px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #ff9f43;
            box-shadow: 0 0 8px rgba(255, 159, 67, 0.6);
            transition: background-color 0.3s;
        }

        .device-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .device-title { display: flex; align-items: center; gap: 12px; }
        .device-title span { font-size: 28px; }
        .device-title h2 { margin: 0; font-size: 20px; font-weight: 600; }
        
        .state-badge {
            font-size: 11px; font-weight: 800; padding: 6px 12px;
            border-radius: 20px; background: #2a2a2a; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid #333;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .controls.three-col { grid-template-columns: 1fr 1fr 1fr; }

        button {
            border: none; border-radius: 14px; padding: 15px 0;
            font-size: 15px; font-weight: 700; color: white;
            cursor: pointer; transition: transform 0.1s, filter 0.2s;
            background: #333;
        }
        
        button:active { transform: scale(0.96); }
        button:hover { filter: brightness(1.1); }
        
        .btn-on { background-color: var(--accent-on); color: #000; font-weight: 800; }
        .btn-off { background-color: var(--accent-off); font-weight: 800; }
        .btn-auto { background-color: var(--accent-auto); color: #000; font-weight: 800; }

        /* --- TIMER TRAY SECTION --- */
        .timer-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #2e2e2e;
        }

        .timer-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .preset-btn {
            background-color: var(--sub-card);
            border: 1px solid #383838;
            border-radius: 12px;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            color: #ddd;
        }

        .preset-btn:active {
            background-color: var(--accent-timer);
            color: #fff;
        }

        /* --- SLIDER UI --- */
        .slider-container {
            background: var(--sub-card);
            border: 1px solid #383838;
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ccc;
        }

        .slider-display {
            color: var(--accent-timer);
            font-size: 14px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            flex: 1;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--accent-timer);
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #444;
            border-radius: 4px;
        }

        .btn-set-timer {
            background-color: var(--accent-timer);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
            margin: 0;
        }

        .custom-timer-row {
            display: flex;
            gap: 8px;
        }

        .custom-timer-input {
            flex: 1;
            background: var(--sub-card);
            border: 1px solid #383838;
            border-radius: 12px;
            color: #fff;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        .custom-timer-input:focus {
            border-color: var(--accent-timer);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Control</h1>
        <div id="conn-dot" class="status-dot"></div>
    </div>

    <!-- PRIMARY: FAN (Relay 3 -> Index 2) -->
    <div class="device-card">
        <div class="device-header">
            <div class="device-title">
                <span>🌀</span>
                <h2>Room Fan</h2>
            </div>
            <div id="badge-fan" class="state-badge">SYNCING...</div>
        </div>
        
        <!-- Main Power Buttons -->
        <div class="controls">
            <button class="btn-on" onclick="sendCommand(2, 'ON')">Turn ON</button>
            <button class="btn-off" onclick="sendCommand(2, 'OFF')">Turn OFF</button>
        </div>

        <!-- Interactive Fan Timers -->
        <div class="timer-section">
            <div class="timer-label">⏱️ Quick Timers</div>
            
            <!-- Quick Presets -->
            <div class="preset-grid">
                <button class="preset-btn" onclick="startCustomTimer(2, 15)">15m</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 30)">30m</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 60)">1h</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 120)">2h</button>
            </div>
            
            <!-- Slider Control (Max 240 mins) -->
            <div class="slider-container">
                <div class="slider-header">
                    <span>Drag to set timer:</span>
                    <span id="fan-slider-val" class="slider-display">45 mins</span>
                </div>
                <div class="slider-row">
                    <input type="range" id="fan-slider" min="1" max="240" value="45" oninput="updateSliderText(this.value)">
                    <button class="btn-set-timer" onclick="startCustomTimer(2, document.getElementById('fan-slider').value)">Start</button>
                </div>
            </div>

            <!-- Custom Minutes Input -->
            <div class="custom-timer-row">
                <input type="number" id="custom-fan-min" class="custom-timer-input" placeholder="Type custom mins..." min="1" max="1440">
                <button class="btn-set-timer" style="padding: 10px 16px; border-radius: 12px;" onclick="startInputTimer(2, 'custom-fan-min')">Start</button>
            </div>
        </div>
    </div>

    <!-- SECONDARY: VESAK LANTERN (Relay 2 -> Index 1) -->
    <div class="device-card">
        <div class="device-header">
            <div class="device-title">
                <span>🏮</span>
                <h2>Vesak Lantern</h2>
            </div>
            <div id="badge-lantern" class="state-badge">SYNCING...</div>
        </div>
        <div class="controls three-col">
            <button class="btn-on" onclick="sendCommand(1, 'ON')">ON</button>
            <button class="btn-off" onclick="sendCommand(1, 'OFF')">OFF</button>
            <button class="btn-auto" onclick="sendCommand(1, 'AUTOTIME')">AUTO</button>
        </div>
    </div>

    <script>
        // --- MQTT SETUP ---
        const mqttBroker = "broker.hivemq.com";
        const mqttPort = 8884;
        const clientID = "MobileApp-" + Math.floor(Math.random() * 10000);
        const client = new Paho.MQTT.Client(mqttBroker, mqttPort, clientID);

        const connDot = document.getElementById("conn-dot");
        const badgeFan = document.getElementById("badge-fan");
        const badgeLantern = document.getElementById("badge-lantern");

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;
        client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: true });

        function onConnect() {
            connDot.style.backgroundColor = "var(--accent-on)";
            connDot.style.boxShadow = "0 0 10px var(--accent-on)";
            client.subscribe("mysolar_lk99/status");
        }

        function onFailure(response) {
            connDot.style.backgroundColor = "var(--accent-off)";
            connDot.style.boxShadow = "0 0 10px var(--accent-off)";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                connDot.style.backgroundColor = "#ff9f43";
                connDot.style.boxShadow = "0 0 10px #ff9f43";
                setTimeout(() => client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: true }), 5000);
            }
        }

        function updateBadge(badgeElement, state, mode) {
            const modes = ["OFF", "ON", "AUTO SCHEDULE", "AUTO VOLT", "TIMER ACTIVE"];
            let modeText = modes[mode] || "UNKNOWN";
            
            if (state) {
                badgeElement.innerText = mode === 4 ? "⏱️ TIMER ON" : (mode === 2 ? "⏰ AUTO ON" : "🟢 ON");
                badgeElement.style.color = mode === 4 ? "var(--accent-timer)" : "var(--accent-on)";
                badgeElement.style.borderColor = mode === 4 ? "var(--accent-timer)" : "var(--accent-on)";
            } else {
                badgeElement.innerText = "⚪ OFF";
                badgeElement.style.color = "var(--text-muted)";
                badgeElement.style.borderColor = "#333";
            }
        }

        function onMessageArrived(message) {
            if (message.destinationName === "mysolar_lk99/status") {
                try {
                    const status = JSON.parse(message.payloadString);
                    if (status.relays) {
                        const lanternData = status.relays.find(r => r.id === 1);
                        const fanData = status.relays.find(r => r.id === 2);
                        
                        if (lanternData) updateBadge(badgeLantern, lanternData.state, lanternData.mode);
                        if (fanData) updateBadge(badgeFan, fanData.state, fanData.mode);
                    }
                } catch (e) { console.error("Failed to parse status:", e); }
            }
        }

        function sendCommand(relayIndex, command) {
            if (client.isConnected()) {
                const msg = new Paho.MQTT.Message(command);
                msg.destinationName = `mysolar_lk99/relay/${relayIndex}`;
                client.send(msg);
                
                const badge = relayIndex === 2 ? badgeFan : badgeLantern;
                badge.innerText = "SENDING...";
                badge.style.color = "#ff9f43";
            } else {
                alert("App is offline. Waiting to reconnect...");
            }
        }

        // --- DYNAMIC TIMER DISPATCHER ---
        function updateSliderText(val) {
            let hours = Math.floor(val / 60);
            let mins = val % 60;
            let display = hours > 0 ? `${hours}h ${mins}m` : `${mins} mins`;
            document.getElementById('fan-slider-val').innerText = display;
        }

        function startCustomTimer(relayIndex, minutes) {
            if (!client.isConnected()) {
                alert("App is offline. Waiting to reconnect...");
                return;
            }

            // 1. Update the timer duration in the ESP32 configuration
            const schedPayload = JSON.stringify({ idx: relayIndex, timer_m: parseInt(minutes) });
            const schedMsg = new Paho.MQTT.Message(schedPayload);
            schedMsg.destinationName = "mysolar_lk99/schedule/set";
            client.send(schedMsg);

            // 2. Trigger TIMER mode immediately
            const timerMsg = new Paho.MQTT.Message("TIMER");
            timerMsg.destinationName = `mysolar_lk99/relay/${relayIndex}`;
            client.send(timerMsg);

            // Instant UI feedback
            const badge = relayIndex === 2 ? badgeFan : badgeLantern;
            let hours = Math.floor(minutes / 60);
            let mins = minutes % 60;
            let displayStr = hours > 0 ? `${hours}H ${mins}M` : `${mins}M`;
            
            badge.innerText = `⏱️ ${displayStr} SET`;
            badge.style.color = "var(--accent-timer)";
            badge.style.borderColor = "var(--accent-timer)";
        }

        function startInputTimer(relayIndex, inputId) {
            const input = document.getElementById(inputId);
            const mins = parseInt(input.value);
            if (!mins || mins <= 0) {
                alert("Please enter a valid number of minutes.");
                return;
            }
            startCustomTimer(relayIndex, mins);
            input.value = "";
        }
    </script>
</body>
</html>
