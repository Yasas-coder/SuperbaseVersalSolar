<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Native App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">
    
    <title>Smart Control</title>
    
    <!-- Paho MQTT Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --sub-card: #282828;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-on: #00e676;
            --accent-off: #ff2e63;
            --accent-auto: #00adb5;
            --accent-timer: #9c27b0;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px 60px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
        
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: #ff9f43;
            box-shadow: 0 0 8px rgba(255, 159, 67, 0.6);
            transition: background-color 0.3s;
        }

        /* --- PRIMARY CARD (FAN) --- */
        .primary-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }

        /* --- SECONDARY CARDS (LANTERN & SCHEDULES) --- */
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 10px;
        }

        .secondary-card {
            background-color: #181818;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid #222;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .device-title { display: flex; align-items: center; gap: 12px; }
        .device-title span { font-size: 28px; }
        .device-title h2 { margin: 0; font-size: 20px; font-weight: 600; }
        .secondary-card .device-title h2 { font-size: 17px; }
        
        .state-badge {
            font-size: 11px; font-weight: 800; padding: 6px 12px;
            border-radius: 20px; background: #2a2a2a; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid #333;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .controls.three-col { grid-template-columns: 1fr 1fr 1fr; }

        button {
            border: none; border-radius: 14px; padding: 15px 0;
            font-size: 15px; font-weight: 700; color: white;
            cursor: pointer; transition: transform 0.1s, filter 0.2s;
            background: #333;
        }
        
        button:active { transform: scale(0.96); }
        button:hover { filter: brightness(1.1); }
        
        .btn-on { background-color: var(--accent-on); color: #000; font-weight: 800; }
        .btn-off { background-color: var(--accent-off); font-weight: 800; }
        .btn-auto { background-color: var(--accent-auto); color: #000; font-weight: 800; }

        /* --- TIMERS (PROMINENT) --- */
        .timer-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2e2e2e;
        }

        .timer-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        
        .preset-btn {
            background-color: var(--sub-card); border: 1px solid #383838;
            border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 700; color: #ddd;
        }
        .preset-btn:active { background-color: var(--accent-timer); color: #fff; }

        .slider-container { background: var(--sub-card); border: 1px solid #383838; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        .slider-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 15px; color: #ccc; }
        .slider-display { color: var(--accent-timer); font-size: 15px; }
        .slider-row { display: flex; align-items: center; gap: 15px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; flex: 1; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--accent-timer); cursor: pointer; margin-top: -9px; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #444; border-radius: 4px; }

        .btn-set-action { border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700; flex-shrink: 0; margin: 0; }
        .btn-timer-action { background-color: var(--accent-timer); }
        .btn-schedule-action { background-color: var(--accent-auto); color: #000; }

        .flex-row { display: flex; gap: 8px; }
        
        .custom-input {
            flex: 1; background: var(--sub-card); border: 1px solid #383838;
            border-radius: 12px; color: #fff; padding: 12px 14px; font-size: 15px; font-weight: 600; outline: none;
        }
        .custom-input:focus { border-color: var(--accent-timer); }
        .custom-input.schedule-input { text-align: center; padding: 12px; font-size: 14px; }
        .custom-input.schedule-input:focus { border-color: var(--accent-auto); }

    </style>
</head>
<body>

    <div class="header">
        <h1>Smart Control</h1>
        <div id="conn-dot" class="status-dot"></div>
    </div>

    <!-- ==========================================
         TOP: PROMINENT FAN CONTROLS 
         ========================================== -->
    <div class="primary-card">
        <div class="device-header">
            <div class="device-title">
                <span>🌀</span>
                <h2 style="font-size: 24px;">Room Fan</h2>
            </div>
            <div id="badge-fan" class="state-badge" style="font-size: 12px;">SYNCING...</div>
        </div>
        
        <div class="controls three-col">
            <button class="btn-on" onclick="sendCommand(2, 'ON')">ON</button>
            <button class="btn-off" onclick="sendCommand(2, 'OFF')">OFF</button>
            <button class="btn-auto" onclick="sendCommand(2, 'AUTOTIME')">AUTO</button>
        </div>

        <div class="timer-section">
            <div class="timer-label">⏱️ Timers</div>
            
            <div class="preset-grid">
                <button class="preset-btn" onclick="startCustomTimer(2, 15)">15m</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 30)">30m</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 60)">1h</button>
                <button class="preset-btn" onclick="startCustomTimer(2, 120)">2h</button>
            </div>
            
            <div class="slider-container">
                <div class="slider-header">
                    <span>Drag to set:</span>
                    <span id="fan-slider-val" class="slider-display">45 mins</span>
                </div>
                <div class="slider-row">
                    <input type="range" id="fan-slider" min="1" max="240" value="45" oninput="updateSliderText(this.value)">
                    <button class="btn-set-action btn-timer-action" onclick="startCustomTimer(2, document.getElementById('fan-slider').value)">Start</button>
                </div>
            </div>

            <div class="flex-row">
                <input type="number" id="custom-fan-min" class="custom-input" placeholder="Custom mins..." min="1" max="1440">
                <button class="btn-set-action btn-timer-action" style="border-radius: 12px;" onclick="startInputTimer(2, 'custom-fan-min')">Start</button>
            </div>
        </div>
    </div>

    <!-- ==========================================
         BOTTOM: ADVANCED & SECONDARY CONTROLS
         ========================================== -->
    <div class="section-title">Advanced & Secondary</div>

    <!-- Fan Schedule Settings (Pushed Down) -->
    <div class="secondary-card">
        <div class="timer-label" style="margin-bottom: 12px;">🌀 Fan Auto Schedule (0-23h)</div>
        <div class="flex-row">
            <input type="number" id="fan-on-h" class="custom-input schedule-input" placeholder="ON Hr" min="0" max="23">
            <input type="number" id="fan-off-h" class="custom-input schedule-input" placeholder="OFF Hr" min="0" max="23">
            <button class="btn-set-action btn-schedule-action" style="border-radius: 12px;" onclick="saveAppSchedule(2, 'fan-on-h', 'fan-off-h')">Save</button>
        </div>
    </div>

    <!-- Vesak Lantern (Pushed Down) -->
    <div class="secondary-card">
        <div class="device-header">
            <div class="device-title">
                <span>🏮</span>
                <h2>Vesak Lantern</h2>
            </div>
            <div id="badge-lantern" class="state-badge">SYNCING...</div>
        </div>
        
        <div class="controls three-col" style="margin-bottom: 15px;">
            <button class="btn-on" onclick="sendCommand(1, 'ON')">ON</button>
            <button class="btn-off" onclick="sendCommand(1, 'OFF')">OFF</button>
            <button class="btn-auto" onclick="sendCommand(1, 'AUTOTIME')">AUTO</button>
        </div>

        <div class="timer-label" style="margin-bottom: 12px; border-top: 1px solid #2e2e2e; padding-top: 15px;">⏰ Lantern Schedule (0-23h)</div>
        <div class="flex-row">
            <input type="number" id="lantern-on-h" class="custom-input schedule-input" placeholder="ON Hr" min="0" max="23">
            <input type="number" id="lantern-off-h" class="custom-input schedule-input" placeholder="OFF Hr" min="0" max="23">
            <button class="btn-set-action btn-schedule-action" style="border-radius: 12px;" onclick="saveAppSchedule(1, 'lantern-on-h', 'lantern-off-h')">Save</button>
        </div>
    </div>

    <script>
        // --- MQTT SETUP ---
        const mqttBroker = "broker.hivemq.com";
        const mqttPort = 8884;
        const clientID = "MobileApp-" + Math.floor(Math.random() * 10000);
        const client = new Paho.MQTT.Client(mqttBroker, mqttPort, clientID);

        const connDot = document.getElementById("conn-dot");
        const badgeFan = document.getElementById("badge-fan");
        const badgeLantern = document.getElementById("badge-lantern");

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;
        client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: true });

        function onConnect() {
            connDot.style.backgroundColor = "var(--accent-on)";
            connDot.style.boxShadow = "0 0 10px var(--accent-on)";
            client.subscribe("mysolar_lk99/status");
        }

        function onFailure(response) {
            connDot.style.backgroundColor = "var(--accent-off)";
            connDot.style.boxShadow = "0 0 10px var(--accent-off)";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                connDot.style.backgroundColor = "#ff9f43";
                connDot.style.boxShadow = "0 0 10px #ff9f43";
                setTimeout(() => client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: true }), 5000);
            }
        }

        function updateBadge(badgeElement, state, mode) {
            const modes = ["OFF", "ON", "AUTO SCHEDULE", "AUTO VOLT", "TIMER ACTIVE"];
            let modeText = modes[mode] || "UNKNOWN";
            
            if (state) {
                badgeElement.innerText = mode === 4 ? "⏱️ TIMER ON" : (mode === 2 ? "⏰ AUTO ON" : "🟢 ON");
                badgeElement.style.color = mode === 4 ? "var(--accent-timer)" : "var(--accent-on)";
                badgeElement.style.borderColor = mode === 4 ? "var(--accent-timer)" : "var(--accent-on)";
            } else {
                badgeElement.innerText = "⚪ OFF";
                badgeElement.style.color = "var(--text-muted)";
                badgeElement.style.borderColor = "#333";
            }
        }

        function onMessageArrived(message) {
            if (message.destinationName === "mysolar_lk99/status") {
                try {
                    const status = JSON.parse(message.payloadString);
                    if (status.relays) {
                        const lanternData = status.relays.find(r => r.id === 1);
                        const fanData = status.relays.find(r => r.id === 2);
                        
                        if (lanternData) updateBadge(badgeLantern, lanternData.state, lanternData.mode);
                        if (fanData) updateBadge(badgeFan, fanData.state, fanData.mode);
                    }
                } catch (e) { console.error("Failed to parse status:", e); }
            }
        }

        function sendCommand(relayIndex, command) {
            if (client.isConnected()) {
                const msg = new Paho.MQTT.Message(command);
                msg.destinationName = `mysolar_lk99/relay/${relayIndex}`;
                client.send(msg);
                
                const badge = relayIndex === 2 ? badgeFan : badgeLantern;
                badge.innerText = "SENDING...";
                badge.style.color = "#ff9f43";
            } else {
                alert("App is offline. Waiting to reconnect...");
            }
        }

        // --- DYNAMIC TIMER DISPATCHER ---
        function updateSliderText(val) {
            let hours = Math.floor(val / 60);
            let mins = val % 60;
            let display = hours > 0 ? `${hours}h ${mins}m` : `${mins} mins`;
            document.getElementById('fan-slider-val').innerText = display;
        }

        function startCustomTimer(relayIndex, minutes) {
            if (!client.isConnected()) {
                alert("App is offline. Waiting to reconnect...");
                return;
            }

            const schedPayload = JSON.stringify({ idx: relayIndex, timer_m: parseInt(minutes) });
            const schedMsg = new Paho.MQTT.Message(schedPayload);
            schedMsg.destinationName = "mysolar_lk99/schedule/set";
            client.send(schedMsg);

            const timerMsg = new Paho.MQTT.Message("TIMER");
            timerMsg.destinationName = `mysolar_lk99/relay/${relayIndex}`;
            client.send(timerMsg);

            const badge = relayIndex === 2 ? badgeFan : badgeLantern;
            let hours = Math.floor(minutes / 60);
            let mins = minutes % 60;
            let displayStr = hours > 0 ? `${hours}H ${mins}M` : `${mins}M`;
            
            badge.innerText = `⏱️ ${displayStr} SET`;
            badge.style.color = "var(--accent-timer)";
            badge.style.borderColor = "var(--accent-timer)";
        }

        function startInputTimer(relayIndex, inputId) {
            const input = document.getElementById(inputId);
            const mins = parseInt(input.value);
            if (!mins || mins <= 0) {
                alert("Please enter a valid number of minutes.");
                return;
            }
            startCustomTimer(relayIndex, mins);
            input.value = "";
        }

        // --- AUTO SCHEDULE DISPATCHER ---
        function saveAppSchedule(relayIndex, onId, offId) {
            if (!client.isConnected()) {
                alert("App is offline. Waiting to reconnect...");
                return;
            }

            const payloadObj = { idx: relayIndex };
            const onVal = document.getElementById(onId).value;
            const offVal = document.getElementById(offId).value;

            if (onVal !== "") payloadObj.on_h = parseInt(onVal);
            if (offVal !== "") payloadObj.off_h = parseInt(offVal);

            if (Object.keys(payloadObj).length === 0) {
                alert("Please enter at least one hour (0-23) to save.");
                return;
            }

            const schedPayload = JSON.stringify(payloadObj);
            const schedMsg = new Paho.MQTT.Message(schedPayload);
            schedMsg.destinationName = "mysolar_lk99/schedule/set";
            client.send(schedMsg);

            // Clear inputs after sending
            document.getElementById(onId).value = "";
            document.getElementById(offId).value = "";

            // Give instant UI feedback
            const badge = relayIndex === 2 ? badgeFan : badgeLantern;
            badge.innerText = "⏰ SCHED SET";
            badge.style.color = "var(--accent-auto)";
            badge.style.borderColor = "var(--accent-auto)";
        }
    </script>
</body>
</html>
