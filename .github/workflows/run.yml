name: Daily Solar Insight AI
on:
  schedule:
    - cron: '0 1 * * *' # Runs every day at 1:00 AM UTC
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        # add your AI library (like google-generativeai or openai) here too
        
      - name: Run AI Insight Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Don't forget to pass your AI_API_KEY and EMAIL passwords here too!
        run: python daily_insights.py
